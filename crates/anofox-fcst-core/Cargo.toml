[package]
name = "anofox-fcst-core"
description = "Core forecasting library for anofox-forecast DuckDB extension"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["native"]
native = []  # Enable native optimizations (parallel, linalg)
wasm = []    # WASM-compatible build

[dependencies]
anofox-forecast = { workspace = true }
anofox-regression = { workspace = true }
faer = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
statrs = { workspace = true }
serde_json = "1"
rustfft = "6.4"

# fdars-core with target-specific features (DEP-03: no "linalg" -- drops the
# duplicate anofox-regression 0.4.0 / faer transitive pull; this crate's own
# anofox-regression/faer deps above stay at their pinned workspace versions)
[target.'cfg(not(target_family = "wasm"))'.dependencies]
fdars-core = { workspace = true, features = ["parallel"] }

[target.'cfg(target_family = "wasm")'.dependencies]
fdars-core = { workspace = true, features = ["js"] }

[dev-dependencies]
approx = "0.5"

[[bench]]
name = "mstl_perf"
harness = false
