# Lightweight static audits (Phase 18, 18-03, D-05): the RUST-10 no-statistics-
# in-C++/SQL audit (scripts/audit_no_stats_in_cpp.py) and the D-03 length-only
# Rust-test sweep (scripts/check_length_only_tests.py). Both are pure python3
# scans over the checked-out source tree -- no DuckDB/Rust build, no secrets,
# no reusable extension-ci-tools workflow. Deliberately independent of
# MainDistributionPipeline.yml, which stays untouched.
# Phase 19 (#272, DIST-01/DIST-02) adds the WASM duckdb_signature section
# parser's own self-test step below -- also a pure python3 scan, no build,
# no secrets.
# The compat-stray-headers job compiles src/include/duckdb_compat.hpp (syntax
# only, no build) against the bundled DuckDB headers with stray headers from
# another DuckDB version on a later include path (-isystem), as a system DuckDB package
# puts them (scripts/check_compat_stray_headers.sh). CI runners have no system
# DuckDB, so without it a __has_include probe that finds the wrong tree only
# breaks on developer machines.
name: Static audits

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit no-stats-in-C++ + length-only sweep
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false

      - name: Audit self-test
        run: python3 scripts/audit_no_stats_in_cpp.py --self-test

      - name: No-statistics-in-C++/SQL audit (RUST-10)
        run: python3 scripts/audit_no_stats_in_cpp.py

      - name: Length-only Rust test sweep (D-03)
        run: python3 scripts/check_length_only_tests.py

      - name: WASM signature parser self-test (#272)
        run: python3 scripts/wasm_signature_sections.py --self-test

      # The DuckDB-Wasm harness's sqllogic runner (test/wasm/sqllogic.mjs):
      # pure node, no npm install and no build, so it runs on every PR (the
      # wasm runtime job itself only runs on full-ci).
      - name: WASM sqllogic runner self-test
        run: node test/wasm/sqllogic.mjs --self-test

  compat-stray-headers:
    name: duckdb_compat.hpp with stray DuckDB headers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false

      - name: Fetch the bundled DuckDB headers
        run: git submodule update --init --depth 1 duckdb

      - name: Compile duckdb_compat.hpp with stray headers on the include path
        run: scripts/check_compat_stray_headers.sh
