#
# Main pipeline for building and distributing the anofox_forecast extension
#
name: Main Extension Distribution Pipeline
on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
  workflow_dispatch:

# OIDC token needed for AWS credentials in the deploy job.
permissions:
  id-token: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  duckdb-lts-build:
    name: Build extension binaries (DuckDB LTS v1.4.5)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.4-andium
    with:
      duckdb_version: v1.4.5
      ci_tools_version: v1.4-andium
      extension_name: anofox_forecast
      enable_rust: true
      # windows_amd64_rtools: only needed for R package builds
      # windows_amd64_mingw: rtools42 MinGW lacks libbcrypt.a needed by Rust getrandom 0.3+
      # windows_amd64: the v1.4-andium ci-tools vcpkg baseline pins an OpenSSL
      #   dependency whose upstream download URL now 404s ("Download failed,
      #   halting portfile") — not fixable here (vcpkg comes from extension-ci-tools).
      #   Excluded on the LTS line only; the v1.5.6 (variegata) windows_amd64 build
      #   uses a newer, working baseline and still ships.
      # osx_arm64 / osx_amd64: since GitHub's macos-26 runner image (20261013),
      #   the v1.4-andium toolchain's linker cannot read the image's MacOSX27.0.sdk
      #   .tbd stubs ("tapi error: malformed file ... unknown architecture"), so
      #   DuckDB core's own libduckdb.dylib fails to link. Not our code, and the
      #   reusable workflow has no runner/SDK override. Excluded on the LTS line only
      #   (first hit at v2026.10.16); the v1.5.6 macOS builds still ship. Re-enable
      #   once the runner image or extension-ci-tools is fixed.
      exclude_archs: 'windows_amd64;windows_amd64_rtools;windows_amd64_mingw;osx_arm64;osx_amd64'

  duckdb-lts-smoke-test:
    name: Smoke test (v1.4.5)
    needs: duckdb-lts-build
    uses: ./.github/workflows/_extension_smoke_test.yml
    with:
      duckdb_version: v1.4.5
      extension_name: anofox_forecast
      # windows_amd64 and osx_* excluded on the LTS line (dead vcpkg OpenSSL baseline; macos-26 SDK linker break — see build job).
      exclude_archs: 'windows_amd64;windows_amd64_rtools;windows_amd64_mingw;osx_arm64;osx_amd64'

  duckdb-lts-deploy:
    name: Deploy extension binaries (v1.4.5 LTS)
    needs: [duckdb-lts-build, duckdb-lts-smoke-test]
    # Run the deploy step even when a non-essential build matrix entry fails.
    # The deploy job itself fans out per arch and only pushes the artifacts
    # that actually exist.
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/_extension_deploy.yml
    secrets: inherit
    with:
      duckdb_version: v1.4.5
      ci_tools_version: v1.4-andium
      extension_name: anofox_forecast
      # windows_amd64 and osx_* excluded on the LTS line (dead vcpkg OpenSSL baseline; macos-26 SDK linker break — see build job).
      exclude_archs: 'windows_amd64;windows_amd64_rtools;windows_amd64_mingw;osx_arm64;osx_amd64'
      deploy_latest: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
      deploy_versioned: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}

  duckdb-latest-build:
    name: Build extension binaries (DuckDB latest v1.5.6)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.6
      ci_tools_version: v1.5-variegata
      extension_name: anofox_forecast
      enable_rust: true
      # windows_amd64_rtools: only needed for R package builds
      # windows_amd64_mingw: rtools42 MinGW lacks libbcrypt.a needed by Rust getrandom 0.3+
      exclude_archs: 'windows_amd64_rtools;windows_amd64_mingw'

  duckdb-latest-smoke-test:
    name: Smoke test (v1.5.6)
    needs: duckdb-latest-build
    uses: ./.github/workflows/_extension_smoke_test.yml
    with:
      duckdb_version: v1.5.6
      extension_name: anofox_forecast
      exclude_archs: 'windows_amd64_rtools;windows_amd64_mingw'

  duckdb-latest-deploy:
    name: Deploy extension binaries (v1.5.6)
    needs: [duckdb-latest-build, duckdb-latest-smoke-test]
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/_extension_deploy.yml
    secrets: inherit
    with:
      duckdb_version: v1.5.6
      ci_tools_version: v1.5-variegata
      extension_name: anofox_forecast
      exclude_archs: 'windows_amd64_rtools;windows_amd64_mingw'
      deploy_latest: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
      deploy_versioned: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}

  duckdb-next-build:
    name: Build + test against DuckDB 2.0-dev (non-blocking)
    # Early warning for the next DuckDB major. Pinned to the duckdb commit the
    # duckdb/community-extensions CI builds 2.0-dev against; keep it (and the
    # ci-tools ref) in sync with duckdb/community-extensions and bump both together.
    # Non-blocking: no job `needs` this one, it gets no secrets and deploys
    # nothing, so a moving 2.0-dev target never holds up a release. (A
    # reusable-workflow job cannot set continue-on-error; a red run here only
    # flags the drift.)
    # Linux x86 runs the full sqllogictest suite. wasm_eh mirrors the registry's
    # PR build, which uses ci-tools' Rust (1.97+) with the old emsdk 3.1.71; see
    # ANOFOX_WASM_RUST_TOOLCHAIN in CMakeLists.txt for why WASM pins Rust 1.86.
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v2.0-cyanoptera
    with:
      duckdb_version: b15358c371daf10dad799a43b6167f6ccdce84d8
      ci_tools_version: v2.0-cyanoptera
      extension_name: anofox_forecast
      enable_rust: true
      reduced_ci_mode: disabled
      artifact_postfix: "-duckdb-next"
      exclude_archs: "linux_arm64;linux_amd64_musl;linux_arm64_musl;osx_amd64;osx_arm64;windows_amd64;windows_amd64_mingw;windows_arm64;wasm_mvp;wasm_threads"

  # A green wasm build only proves the extension COMPILES + LINKS. This job
  # proves it actually LOADS and RUNS in DuckDB-Wasm — the gap described in
  # query.farm's "Testing DuckDB WASM Extensions". It consumes the wasm_eh
  # artifact the build job already produced and runs test/wasm/run.mjs against
  # it. Gating (no continue-on-error) per milestone requirement CI-01.
  wasm-runtime-test:
    name: WASM runtime test (Node harness, v1.5.6 wasm_eh)
    needs: duckdb-latest-build
    if: ${{ !cancelled() && needs.duckdb-latest-build.result == 'success' }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # Submodules not needed: the harness only uses test/ (this repo) + the
        # downloaded .wasm; skipping them keeps this leg fast.

      - name: Download built wasm_eh extension
        uses: actions/download-artifact@v4
        with:
          name: anofox_forecast-v1.5.6-extension-wasm_eh
          path: wasm-artifact

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install harness dependencies
        run: npm --prefix test/wasm install

      - name: Run DuckDB-Wasm load + runtime harness
        run: |
          EXT=$(find wasm-artifact -name 'anofox_forecast.duckdb_extension.wasm' | head -1)
          if [ -z "$EXT" ]; then echo "::error::built wasm extension not found in artifact"; exit 1; fi
          echo "Testing extension: $EXT"
          node test/wasm/run.mjs --ext "$EXT"

  build-and-test-rust:
    name: Rust Tests
    timeout-minutes: 25
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build Rust library
        run: cargo build --release

      - name: Run Rust tests
        run: cargo test --all-features

  rust-msrv:
    name: Rust MSRV (1.89.0)
    timeout-minutes: 25
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.89.0

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-msrv-

      - name: Build on MSRV toolchain
        run: cargo build --workspace --all-targets --locked

      - name: Run Rust tests on MSRV toolchain
        run: cargo test --workspace --locked
