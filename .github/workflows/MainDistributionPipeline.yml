#
# Main pipeline for building and distributing the anofox_forecast extension.
#
# Two full build/smoke-test/deploy lines, aligned with anofox-statistics:
# v2.0.0 stable (registry track cyanoptera) and v1.5.6 (registry track
# variegata). The v1.4.5 LTS (andium) line was dropped on 2026-10-28.
name: Main Extension Distribution Pipeline
on:
  push:
    branches: [main]
    tags: ['**']
  # PR fast lane (as anofox-statistics #243): pull requests build and test
  # linux_amd64 only (both DuckDB lines); the full platform matrix runs on main,
  # tags, workflow_dispatch and PRs labelled `full-ci` (dependency bumps,
  # CMake/compat changes, release PRs). Adding the label re-runs the pipeline.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

# OIDC token needed for AWS credentials in the deploy job.
permissions:
  id-token: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  duckdb-v15-build:
    # Full build + deploy line kept for the community-extensions registry's
    # `variegata` (1.5.x) track, and for DataZoo repo users still on 1.5.6.
    name: Build extension binaries (DuckDB v1.5.6, registry track variegata)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.6
      ci_tools_version: v1.5-variegata
      extension_name: anofox_forecast
      enable_rust: true
      # windows_amd64_rtools: only needed for R package builds
      # windows_amd64_mingw: rtools42 MinGW lacks libbcrypt.a needed by Rust getrandom 0.3+
      exclude_archs: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && 'windows_amd64_rtools;windows_amd64_mingw' || 'linux_arm64;linux_amd64_musl;osx_amd64;osx_arm64;windows_amd64;windows_amd64_mingw;windows_amd64_rtools;windows_arm64;wasm_mvp;wasm_eh;wasm_threads' }}

  duckdb-v15-smoke-test:
    name: Smoke test (v1.5.6)
    needs: duckdb-v15-build
    uses: ./.github/workflows/_extension_smoke_test.yml
    with:
      duckdb_version: v1.5.6
      extension_name: anofox_forecast
      exclude_archs: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && 'windows_amd64_rtools;windows_amd64_mingw' || 'linux_arm64;linux_amd64_musl;osx_amd64;osx_arm64;windows_amd64;windows_amd64_mingw;windows_amd64_rtools;windows_arm64;wasm_mvp;wasm_eh;wasm_threads' }}

  duckdb-v15-deploy:
    name: Deploy extension binaries (v1.5.6)
    needs: [duckdb-v15-build, duckdb-v15-smoke-test]
    # Deploy only artifacts that passed the smoke test (as anofox-statistics):
    # `!cancelled()` alone let a FAILED smoke test fall through to deploy.
    if: ${{ !cancelled() && needs.duckdb-v15-smoke-test.result == 'success' }}
    uses: ./.github/workflows/_extension_deploy.yml
    secrets: inherit
    with:
      duckdb_version: v1.5.6
      ci_tools_version: v1.5-variegata
      extension_name: anofox_forecast
      exclude_archs: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && 'windows_amd64_rtools;windows_amd64_mingw' || 'linux_arm64;linux_amd64_musl;osx_amd64;osx_arm64;windows_amd64;windows_amd64_mingw;windows_amd64_rtools;windows_arm64;wasm_mvp;wasm_eh;wasm_threads' }}
      deploy_latest: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
      deploy_versioned: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}

  # Stable line (v2.0.0). Matches the duckdb + extension-ci-tools submodules and
  # duckdb/community-extensions' default build (ref v2.0, ci-tools
  # v2.0-cyanoptera); bump the duckdb tag, the ci-tools ref and both
  # submodules together.
  # reduced_ci_mode: disabled makes linux_amd64 run the full sqllogictest suite.
  # WASM pins Rust 1.86 via ANOFOX_WASM_RUST_TOOLCHAIN in CMakeLists.txt
  # (ci-tools v2.0 uses Rust 1.97 + emsdk 3.1.71).
  # On cyanoptera, osx_amd64, the musl archs and windows_arm64 are opt-in
  # ci-tools archs and are not built here (the v1.5.6 line still ships
  # osx_amd64).
  # Smoke tests use the official v2.0.0 CLI tarballs (see scripts/smoke_test.py).
  duckdb-stable-build:
    name: Build extension binaries (DuckDB stable v2.0.0)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v2.0-cyanoptera
    with:
      duckdb_version: v2.0.0
      ci_tools_version: v2.0-cyanoptera
      extension_name: anofox_forecast
      enable_rust: true
      reduced_ci_mode: disabled
      exclude_archs: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && 'windows_amd64_rtools;windows_amd64_mingw' || 'linux_arm64;linux_amd64_musl;osx_amd64;osx_arm64;windows_amd64;windows_amd64_mingw;windows_amd64_rtools;windows_arm64;wasm_mvp;wasm_eh;wasm_threads' }}

  duckdb-stable-smoke-test:
    name: Smoke test (v2.0.0)
    needs: duckdb-stable-build
    uses: ./.github/workflows/_extension_smoke_test.yml
    with:
      duckdb_version: v2.0.0
      extension_name: anofox_forecast
      exclude_archs: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && 'windows_amd64_rtools;windows_amd64_mingw' || 'linux_arm64;linux_amd64_musl;osx_amd64;osx_arm64;windows_amd64;windows_amd64_mingw;windows_amd64_rtools;windows_arm64;wasm_mvp;wasm_eh;wasm_threads' }}

  duckdb-stable-deploy:
    name: Deploy extension binaries (v2.0.0 stable)
    needs: [duckdb-stable-build, duckdb-stable-smoke-test]
    if: ${{ !cancelled() && needs.duckdb-stable-smoke-test.result == 'success' }}
    uses: ./.github/workflows/_extension_deploy.yml
    secrets: inherit
    with:
      duckdb_version: v2.0.0
      ci_tools_version: v2.0-cyanoptera
      extension_name: anofox_forecast
      exclude_archs: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && 'windows_amd64_rtools;windows_amd64_mingw' || 'linux_arm64;linux_amd64_musl;osx_amd64;osx_arm64;windows_amd64;windows_amd64_mingw;windows_amd64_rtools;windows_arm64;wasm_mvp;wasm_eh;wasm_threads' }}
      deploy_latest: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
      deploy_versioned: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}

  # A green wasm build only proves the extension COMPILES + LINKS. This job
  # proves it actually LOADS and RUNS in DuckDB-Wasm — the gap described in
  # query.farm's "Testing DuckDB WASM Extensions". It consumes the wasm_eh
  # artifact the build job already produced and runs test/wasm/run.mjs against
  # it. Gating (no continue-on-error) per milestone requirement CI-01.
  # Stays on the v1.5.6 line: the newest @duckdb/duckdb-wasm on npm
  # (1.33.1-dev65.0, dist-tag next; latest is 1.33.1-dev57.0) bundles at most
  # engine v1.5.6 (the storage-version list in dist/duckdb-eh.wasm ends at
  # v1.5.6, checked 2026-10-22), and DuckDB-Wasm rejects an extension built for
  # a different engine version. When a duckdb-wasm build bundling v2.0.0
  # ships, bump test/wasm/package.json, `needs` and the artifact name to the
  # stable line together.
  wasm-runtime-test:
    name: WASM runtime test (Node harness, v1.5.6 wasm_eh)
    needs: duckdb-v15-build
    # Full-CI runs only: the PR fast lane builds no wasm artifact.
    if: ${{ !cancelled() && needs.duckdb-v15-build.result == 'success' && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # Submodules not needed: the harness only uses test/ (this repo) + the
        # downloaded .wasm; skipping them keeps this leg fast.

      - name: Download built wasm_eh extension
        uses: actions/download-artifact@v4
        with:
          name: anofox_forecast-v1.5.6-extension-wasm_eh
          path: wasm-artifact

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install harness dependencies
        run: npm --prefix test/wasm install

      - name: Run DuckDB-Wasm load + runtime harness
        run: |
          EXT=$(find wasm-artifact -name 'anofox_forecast.duckdb_extension.wasm' | head -1)
          if [ -z "$EXT" ]; then echo "::error::built wasm extension not found in artifact"; exit 1; fi
          echo "Testing extension: $EXT"
          node test/wasm/run.mjs --ext "$EXT"

  build-and-test-rust:
    name: Rust Tests
    timeout-minutes: 25
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build Rust library
        run: cargo build --release

      - name: Run Rust tests
        run: cargo test --all-features

      # Coverage report (non-blocking, as anofox-statistics): an lcov + HTML
      # report uploaded as an artifact. Failures here never fail the job.
      - name: Install llvm-tools + cargo-llvm-cov
        continue-on-error: true
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --locked

      - name: Rust coverage (cargo llvm-cov)
        continue-on-error: true
        run: |
          cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info
          cargo llvm-cov report --html --output-dir coverage-html
          cargo llvm-cov report --summary-only | tee coverage-summary.txt

      - name: Upload coverage report
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage
          path: |
            lcov.info
            coverage-html
            coverage-summary.txt
          if-no-files-found: ignore

  sanitizer-tests:
    name: ASAN + UBSAN sqllogictests (Linux debug, non-blocking)
    # As anofox-statistics: a debug build of DuckDB + the extension with
    # AddressSanitizer and UndefinedBehaviorSanitizer. The Rust FFI crate is
    # built normally by Corrosion (uninstrumented) and linked in; ASAN still
    # catches C++-side misuse of FFI buffers. Nothing `needs` this job and it
    # is continue-on-error, so it never blocks release artifacts.
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    continue-on-error: true
    env:
      GEN: ninja
      # CMAKE_CXX_STANDARD=17: the extension compiles as C++17 while DuckDB
      # defaults to C++11; at -O0 that ODR-mismatches LogicalType constants
      # at link time. Building DuckDB as C++17 too makes both sides agree.
      EXT_FLAGS: "-DENABLE_SANITIZER=TRUE -DENABLE_UBSAN=TRUE -DCMAKE_CXX_STANDARD=17"
      ASAN_OPTIONS: "detect_leaks=1:abort_on_error=1:strict_string_checks=1:detect_stack_use_after_return=1"
      UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build ccache libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: sanitizer-debug-${{ runner.os }}
          max-size: 2G

      - name: Build debug (ASAN + UBSAN)
        run: make debug

      - name: Run sqllogictests under sanitizers
        run: ./build/debug/test/unittest "test/*"

  rust-msrv:
    name: Rust MSRV (1.89.0)
    timeout-minutes: 25
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.89.0

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-msrv-

      - name: Build on MSRV toolchain
        run: cargo build --workspace --all-targets --locked

      - name: Run Rust tests on MSRV toolchain
        run: cargo test --workspace --locked
